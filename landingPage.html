<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="form-wrapper">
        <div class="banner-container">
            <img src="Untitled.png" alt="Form Banner" class="banner-image">
        </div>

        <div class="form-container">
            <h1 class="form-title">Registration Form</h1>
            <form action="#" method="post" novalidate>
                <div class="section-container personal-info-container">
                    <div class="form-section">
                        <h2 class="section-title">Personal Information</h2>
                        <div class="form-group">
                            <label for="fullName" class="required">Full Name *</label>
                            <div class="input-container">
                                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                                    required pattern="[A-Za-z\s]+" title="Please enter text only">
                                <div class="error-message"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <fieldset>
                                <legend class="required">Gender *</legend>
                                <div class="radio-group" role="radiogroup">
                                    <div class="radio-option">
                                        <input type="radio" id="male" name="gender" value="male" required>
                                        <label for="male">Male</label>
                                    </div>
                                    <div class="radio-option">
                                        <input type="radio" id="female" name="gender" value="female">
                                        <label for="female">Female</label>
                                    </div>
                                    <div class="radio-option">
                                        <input type="radio" id="preferNotToSay" name="gender" value="preferNotToSay">
                                        <label for="preferNotToSay">Prefer not to say</label>
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>

                <div class="section-container contact-info-container">
                    <div class="form-section">
                        <h2 class="section-title">Contact Information</h2>
                        <div class="form-group">
                            <label for="contactNumber" class="required">Contact Number *</label>
                            <div class="phone-input-group">
                                <select id="countryCode" name="countryCode" class="country-code" required>
                                    <option value="+91" selected>+91 (India)</option>
                                    <option value="+1">+1 (USA/Canada)</option>
                                    <option value="+44">+44 (UK)</option>
                                    <option value="+61">+61 (Australia)</option>
                                    <option value="+86">+86 (China)</option>
                                    <option value="+49">+49 (Germany)</option>
                                    <option value="+33">+33 (France)</option>
                                    <option value="+81">+81 (Japan)</option>
                                </select>
                                <input type="tel" id="contactNumber" name="contactNumber" placeholder="Phone number"
                                    class="phone-number" required inputmode="numeric" maxlength="15" pattern="[0-9]+"
                                    title="Please enter numbers only">
                                <div class="error-message"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="address" class="required">Address *</label>
                            <textarea id="address" name="address" placeholder="Enter your complete address"
                                required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="email" class="required">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                        </div>
                    </div>
                </div>

                <div class="section-container company-info-container">
                    <div class="form-section">
                        <h2 class="section-title">Company Information</h2>
                        <div class="form-group">
                            <label for="companyName" class="required">Company Name *</label>
                            <input type="text" id="companyName" name="companyName" placeholder="Enter your company name"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="department" class="required">Department *</label>
                            <select id="department" name="department" required>
                                <option value="" disabled selected>Select your department</option>
                                <option value="HR">HR</option>
                                <option value="Sales">Sales</option>
                                <option value="Development">Development</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section submit-section">
                    <div class="form-group">
                        <div class="form-control-wrapper submit-btn-wrapper">
                            <button type="submit" class="submit-btn">Submit</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
